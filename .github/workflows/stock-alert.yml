name: stock-alert

# 예약(cron) 실행은 새 저장소에서 늦게 시작되거나 빠지는 일이 있어 쓰지 않음.
# 매일 아침 Claude가 mode=day 로 한 번 실행하면, 장 마감까지 2분마다 스스로 반복하고
# 실행 시간 한도(6시간)에 가까워지면 자기 자신을 다시 실행해서 이어감.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "day(장 마감까지 2분마다 반복) / check / summary / test / message"
        default: "test"
      message:
        description: "mode=message일 때 보낼 텍스트"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: stock-alert-${{ github.event.inputs.mode == 'day' && 'day' || 'tick' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run bot
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MESSAGE: ${{ github.event.inputs.message }}
          MODE: ${{ github.event.inputs.mode || 'check' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$MODE" != "day" ]; then
            python bot.py
            exit 0
          fi
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          save() {
            git add data/
            git diff --cached --quiet || git commit -q -m "data $(date -u +%F_%H%M)"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
          }
          now() { TZ=Asia/Seoul date +%H%M; }
          # 실행 한도(6시간)는 작업 시작부터 계산되므로, 대기 시간도 포함해서 잼
          START=$(date +%s)
          # 장 시작 전이면 09:01까지 대기
          while [ "$(now)" -lt 0901 ]; do sleep 60; done
          # 08:45 premarket이 바꾼 watchlist(이슈 종목) 반영
          git pull -q --rebase origin main || true
          while [ "$(now)" -le 1535 ]; do
            MODE=check python bot.py || echo "check failed"
            save
            # 실행 한도(6시간) 전에 다음 실행으로 넘김
            if [ $(( $(date +%s) - START )) -gt 18000 ]; then
              curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/workflows/stock-alert.yml/dispatches" \
                -d '{"ref":"main","inputs":{"mode":"day"}}'
              echo "handed off to next run"
              exit 0
            fi
            sleep 120
          done
          MODE=summary python bot.py || echo "summary failed"
          save

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: state-${{ github.run_id }}

      - name: Save data
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data/ watchlist.json
          git diff --cached --quiet || git commit -m "data $(date -u +%F_%H%M)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q && break
            sleep 5
          done
