name: stock-alert

on:
  schedule:
    - cron: "3-53/10 0-5 * * 1-5"    # KST 09:03~14:53 평일 10분마다 (정각 혼잡 회피)
    - cron: "3,13,23,33 6 * * 1-5"  # KST 15:03~15:33
    - cron: "43 6 * * 1-5"          # KST 15:43 장 마감 요약
  workflow_dispatch:
    inputs:
      mode:
        description: "check / summary / test / message / day(장 마감까지 10분마다 반복)"
        default: "test"
      message:
        description: "mode=message일 때 보낼 텍스트"
        default: ""

permissions:
  contents: write

concurrency:
  group: stock-alert-${{ github.event.inputs.mode == 'day' && 'day' || 'tick' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run bot
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ github.event.inputs.message }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '43 6 * * 1-5' && 'summary' || 'check') }}
        run: |
          if [ "$MODE" != "day" ]; then
            python bot.py
            exit 0
          fi
          # day 모드: 예약 실행이 밀리거나 빠져도 장 마감까지 10분마다 직접 반복
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          save() {
            git add data/
            git diff --cached --quiet || git commit -q -m "data $(date -u +%F_%H%M)"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
          }
          while [ "$(TZ=Asia/Seoul date +%H%M)" -le 1535 ]; do
            MODE=check python bot.py || echo "check failed"
            save
            sleep 600
          done
          MODE=summary python bot.py || echo "summary failed"
          save

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: state-${{ github.run_id }}

      - name: Save data
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data $(date -u +%F_%H%M)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q && break
            sleep 5
          done
